<mat-action-list>
    <button type="button" mat-list-item (click)="onSendRemissionGuide()">
        <mat-icon class="color-black" matListItemIcon>near_me</mat-icon>
        <span matListItemTitle>Enviar a Sunat</span>
    </button>
    <button type="button" mat-list-item [routerLink]="['/remissionGuides/charge']" [queryParams]="{ remissionGuideId }" (click)="matBottomSheetRef.dismiss()">
        <mat-icon class="color-black" matListItemIcon>content_copy</mat-icon>
        <span matListItemTitle>Copiar guia de remission</span>
    </button>
    <button type="button" mat-list-item (click)="onDownloadXml()">
        <mat-icon class="color-black" matListItemIcon>download</mat-icon>
        <span matListItemTitle>Descargar XML</span>
    </button>
    <button type="button" mat-list-item (click)="onDownloadCdr()">
        <mat-icon class="color-black" matListItemIcon>download</mat-icon>
        <span matListItemTitle>Descargar CDR</span>
    </button>
    <button type="button" mat-list-item (click)="onExportPdf()">
        <mat-icon class="color-black" matListItemIcon>download</mat-icon>
        <span matListItemTitle>Exportar PDF A4</span>
    </button>
    <button type="button" mat-list-item (click)="onExportPdfTicket()">
        <mat-icon class="color-black" matListItemIcon>download</mat-icon>
        <span matListItemTitle>Exportar PDF Ticket 80mm</span>
    </button>
</mat-action-list>
