<div class="container">
    <div class="mat-elevation-z2">
        <table mat-table [dataSource]="$dataSource()" class="w-100">
            <ng-container matColumnDef="createdAt">
                <th mat-header-cell *matHeaderCellDef>F/H registro</th>
                <td mat-cell *matCellDef="let element">{{ element.createdAt | date }}</td>
            </ng-container>
            <ng-container matColumnDef="user">
                <th mat-header-cell *matHeaderCellDef>Usuario</th>
                <td mat-cell *matCellDef="let element">{{ element.user.name }}</td>
            </ng-container>
            <ng-container matColumnDef="office">
                <th mat-header-cell *matHeaderCellDef>Origen</th>
                <td mat-cell *matCellDef="let element">{{ element.office.name }}</td>
            </ng-container>
            <ng-container matColumnDef="destinyOffice">
                <th mat-header-cell *matHeaderCellDef>Destino</th>
                <td mat-cell *matCellDef="let element">{{ element.toOffice.name }}</td>
            </ng-container>
            <ng-container matColumnDef="observation">
                <th mat-header-cell *matHeaderCellDef>Observaciones</th>
                <td mat-cell *matCellDef="let element" [ngClass]="{ 'text-muted': !element.observation }">{{ element.observation || 'NINGUNO' }}</td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element" class="text-right">
                    <button mat-icon-button [matMenuTriggerFor]="menu">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu" xPosition="before">
                        <!--<button [routerLink]="['/transfers/create', element.id, 'edit']" mat-menu-item>
                            <mat-icon>edit</mat-icon>
                            <span>Editar</span>
                        </button>-->
                        <button type="button" (click)="onDeleteTransfer(element.id)" mat-menu-item>
                            <mat-icon>delete</mat-icon>
                            <span>Eliminar</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize" [pageIndex]="pageIndex"
            [length]="$length()" (page)="handlePageEvent($event)" showFirstLastButtons></mat-paginator>
    </div>
    <!--<div class="fixed-bottom p-3" style="right: 0; left: unset; width: auto;">
        <button mat-fab color="primary" class="float-right" routerLink="/transfers/create">
            <mat-icon>add</mat-icon>
        </button>
    </div>-->
</div>
