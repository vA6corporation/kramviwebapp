<mat-action-list>
    @for (proformaItem of $proformaItems(); track $index; let i = $index) {
    <button mat-list-item (click)="onSelectProformaItem(i)">
        <span matListItemTitle>{{ proformaItem.fullName }}</span>
        <div matListItemLine class="d-flex my-1">
            <span class="mr-2">x{{ proformaItem.quantity }}</span>
            @if (proformaItem.igvCode === igvCode.BONIFICACION) {
            <span class="mr-2" [style.color]="'green'">Bonificacion</span>
            }
            @if (proformaItem.igvCode === igvCode.EXONERADO) {
            <span class="text-primary mr-2">Exonerado</span>
            }
            @if (proformaItem.igvCode === igvCode.INAFECTO) {
            <span class="text-primary mr-2">Inafecto</span>
            }
            <span class="text-muted">{{ proformaItem.observation }}</span>
            <span class="spacer"></span>
            <span>{{ (proformaItem.price * proformaItem.quantity).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}</span>
        </div>
    </button>
    }
    <button mat-list-item>
        <div matListItemTitle class="d-flex font-weight-bold">
            <span>
                Total ({{ $countProducts() }})
            </span>
            <span class="spacer"></span>
            <span>
                {{ $charge().toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}
            </span>
        </div>
    </button>
</mat-action-list>
