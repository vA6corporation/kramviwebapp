<mat-action-list>
    @for (productItem of $productItems(); track i; let i = $index) {
        <button mat-list-item (click)="onSelectBillItem(i)">
            <span matListItemTitle>{{ productItem.fullName }}</span>
            <div matListItemLine class="d-flex my-1">
                <span class="mr-2">x{{ productItem.quantity }}</span>
                @if (productItem.igvCode === igvCode.BONIFICACION) {
                    <span class="mr-2" [style.color]="'green'">Bonificacion</span>
                }
                @if (productItem.igvCode === igvCode.EXONERADO) {
                    <span class="text-primary mr-2">Exonerado</span>
                }
                @if (productItem.igvCode === igvCode.INAFECTO) {
                    <span class="text-primary mr-2">Inafecto</span>
                }
                <span class="spacer"></span>
                <span>{{ (productItem.price * productItem.quantity).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}</span>
            </div>
        </button>
    }
    <button mat-list-item>
        <div matListItemTitle class="d-flex font-weight-bold">
            <span>
              Total ({{ $countProducts() }})
            </span>
            <span class="spacer"></span>
            <span>
                {{ $charge().toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }}
            </span>
        </div>
    </button>
</mat-action-list>
