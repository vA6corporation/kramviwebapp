<form (ngSubmit)="onSubmit()" [formGroup]="formGroup" autocomplete="off">
    <h2 mat-dialog-title>Nueva compra</h2>
    <mat-dialog-content>
        <mat-form-field appearance="fill">
            <mat-label>Cantidad</mat-label>
            <input type="number" matInput formControlName="quantity">
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Costo unitario</mat-label>
            <input type="number" matInput formControlName="cost">
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Observaciones</mat-label>
            <input type="text" matInput formControlName="observation">
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Fecha de compra</mat-label>
            <input matInput [matDatepicker]="pickerCreatedAt" formControlName="createdAt">
            <mat-datepicker-toggle matSuffix [for]="pickerCreatedAt"></mat-datepicker-toggle>
            <mat-datepicker #pickerCreatedAt></mat-datepicker>
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions>
        <span class="spacer"></span>
        <button mat-raised-button mat-dialog-close color="primary" [disabled]="$isLoading()">CANCELAR</button>
        <button type="submit" mat-flat-button color="primary" [disabled]="$isLoading()">GUARDAR</button>
    </mat-dialog-actions>
</form>
